<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card">
        <h1>Registrieren</h1>
        <p class="subtitle">Erstelle ein neues Konto.</p>

        <div id="setup-hint" class="notice notice-info" hidden>
            Supabase ist noch nicht konfiguriert. Trage deine URL und deinen anon Key in
            <code>js/supabase-config.js</code> ein.
        </div>

        <form id="register-form" novalidate>
            <label for="email">E-Mail-Adresse</label>
            <input type="email" id="email" name="email" placeholder="name@beispiel.de"
                   autocomplete="email" required>

            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" placeholder="Mindestens 6 Zeichen"
                   autocomplete="new-password" required>

            <label for="password-confirm">Passwort bestätigen</label>
            <input type="password" id="password-confirm" name="password-confirm"
                   placeholder="Passwort wiederholen" autocomplete="new-password" required>

            <div id="error-box" class="notice notice-error" role="alert" hidden></div>
            <div id="success-box" class="notice notice-success" role="status" hidden></div>

            <button type="submit" id="submit-btn">Konto erstellen</button>
        </form>

        <p class="links">
            Hast du schon ein Konto? <a href="index.html">Zum Login</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
